<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Админ панель — ЦОН</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue: #0a3d91; --gold: #c8a94a; --dark: #0d1b2a;
      --gray: #5a6478; --gray-light: #f4f6fb; --white: #fff;
      --font-display: 'Playfair Display', serif;
      --font-body: 'IBM Plex Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-body); background: var(--gray-light); color: var(--dark); }

    /* HEADER */
    .admin-header {
      background: var(--blue);
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .admin-header h1 {
      font-family: var(--font-display);
      color: white;
      font-size: 22px;
    }
    .admin-header span { color: rgba(255,255,255,0.6); font-size: 13px; }
    .back-btn {
      background: rgba(255,255,255,0.15);
      color: white;
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.25); }

    /* STATS */
    .stats-bar {
      display: flex;
      gap: 16px;
      padding: 24px 32px;
      flex-wrap: wrap;
    }
    .stat-box {
      background: white;
      border-radius: 12px;
      padding: 20px 28px;
      box-shadow: 0 2px 12px rgba(10,61,145,0.08);
      min-width: 160px;
    }
    .stat-box .num { font-family: var(--font-display); font-size: 32px; font-weight: 700; color: var(--blue); }
    .stat-box .lbl { font-size: 12px; color: var(--gray); margin-top: 4px; }

    /* TABLE WRAPPER */
    .table-wrap {
      margin: 0 32px 32px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 2px 16px rgba(10,61,145,0.08);
      overflow: hidden;
    }
    .table-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 28px;
      border-bottom: 1px solid #eef0f5;
    }
    .table-top h2 { font-size: 18px; font-weight: 700; }
    .clear-btn {
      background: #fee2e2;
      color: #b91c1c;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .clear-btn:hover { background: #fecaca; }

    table { width: 100%; border-collapse: collapse; }
    thead { background: var(--gray-light); }
    th {
      text-align: left;
      padding: 12px 20px;
      font-size: 12px;
      font-weight: 700;
      color: var(--gray);
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
    td { padding: 14px 20px; border-bottom: 1px solid #f0f2f7; font-size: 14px; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafbff; }

    /* STATUS */
    .status-select {
      padding: 5px 10px;
      border-radius: 6px;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      outline: none;
    }
    .status-wait   { background: #fef9c3; color: #854d0e; }
    .status-done   { background: #dcfce7; color: #166534; }
    .status-cancel { background: #fee2e2; color: #991b1b; }

    .del-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      opacity: 0.5;
      transition: opacity 0.2s;
    }
    .del-btn:hover { opacity: 1; }

    /* EMPTY */
    .empty { text-align: center; padding: 48px; color: var(--gray); font-size: 15px; }

    @media (max-width: 700px) {
      .admin-header, .stats-bar, .table-wrap { padding-left: 16px; padding-right: 16px; }
      .table-wrap { margin-left: 16px; margin-right: 16px; }
      th, td { padding: 10px 12px; font-size: 12px; }
      th:nth-child(4), td:nth-child(4) { display: none; }
    }
  </style>
</head>
<body>

<header class="admin-header">
  <h1>⚙️ Админ панель</h1>
  <span>ЦОН — Кезектер базасы</span>
  <a href="index.html" class="back-btn">← Сайтқа қайту</a>
</header>

<div class="stats-bar">
  <div class="stat-box">
    <div class="num" id="totalCount">0</div>
    <div class="lbl">Барлық кезек</div>
  </div>
  <div class="stat-box">
    <div class="num" id="waitCount" style="color:#854d0e">0</div>
    <div class="lbl">Күтуде</div>
  </div>
  <div class="stat-box">
    <div class="num" id="doneCount" style="color:#166534">0</div>
    <div class="lbl">Орындалды</div>
  </div>
  <div class="stat-box">
    <div class="num" id="cancelCount" style="color:#991b1b">0</div>
    <div class="lbl">Болдырылмады</div>
  </div>
</div>

<div class="table-wrap">
  <div class="table-top">
    <h2>Кезектер тізімі</h2>
    <button class="clear-btn" onclick="clearAll()">🗑 Барлығын өшіру</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>Нөмір</th>
        <th>Қызмет</th>
        <th>Күн / Уақыт</th>
        <th>Телефон</th>
        <th>Орталық</th>
        <th>Күй</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="adminTable"></tbody>
  </table>
</div>

<script src="app.js"></script>
<script>
  // Override renderAdmin to also update stat counters
  const _orig = renderAdmin;
  document.addEventListener('DOMContentLoaded', () => {
    updateStats();
  });

  function updateStats() {
    const all = DB.getAll();
    document.getElementById('totalCount').textContent  = all.length;
    document.getElementById('waitCount').textContent   = all.filter(r => r.status === 'Күтуде').length;
    document.getElementById('doneCount').textContent   = all.filter(r => r.status === 'Орындалды').length;
    document.getElementById('cancelCount').textContent = all.filter(r => r.status === 'Болдырылмады').length;
  }

  const origChange = window.changeStatus;
  window.changeStatus = function(id, status) {
    DB.updateStatus(id, status);
    renderAdmin();
    updateStats();
  };

  const origDelete = window.deleteRecord;
  window.deleteRecord = function(id) {
    if (confirm('Жазбаны өшіресіз бе?')) {
      DB.delete(id);
      renderAdmin();
      updateStats();
    }
  };

  window.clearAll = function() {
    if (confirm('Барлық кезектерді өшіресіз бе?')) {
      localStorage.removeItem('con_appointments');
      renderAdmin();
      updateStats();
    }
  };
</script>
</body>
</html>
